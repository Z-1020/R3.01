<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Shifumi</title>
     <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    <script defer src="script/shifumi.js"></script>
    <link href="style/style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 class="display-4 text-center text-success">Shifumi</h1>
        </header>
        <main>
        <p id="choix_utilisateur" class="text-center h2">Que choisissez vous ?</p>
        <p id="choix-robot" class="text-center h2">choix adversaire</p>
        
        <div id="groupe-bouton" class="text-center">

        <button class="bouton btn btn-success btn-lg" type="button" aria-label="Vous avez choisi pierre" value="Pierre">Pierre</button> 
        <button class="bouton btn btn-success btn-lg" type="button" aria-label="Vous avez choisi feuille" value="Feuille">Feuille</button> 
        <button class="bouton btn btn-success btn-lg" type="button" aria-label="Vous avez choisi ciseaux" value="Ciseaux"> Ciseaux</button> 
        </div>
        <p id="resultat" class="display-6 text-center">Résultat</p>

        <p id="victoire" class="text-center h5">Nombre de victoire: 0 </p>
        <p id="egalite" class="text-center h5">Nombre d'égalité: 0 </p>
        <p id="defaite" class="text-center h5">Nombre de défaite: 0 </p>
        
        <div class="text-center">
        <button class="bouton-reinitialiser btn btn-success btn-lg" type="button" value="reset"> Réinitialiser le score</button> 
    </div>
    </main>
    <footer>
        <p></p>
    </footer>
    </body>
</html>
